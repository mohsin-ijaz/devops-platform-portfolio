apiVersion: v1
clusters:
- cluster:
    # TODO: populate from Terraform output after cluster provisioning
    # Run: terraform output -raw kubeconfig > ~/.kube/config
    certificate-authority-data: <BASE64_ENCODED_CA_CERT>
    server: https://<K8S_API_SERVER_IP>:6443
    insecure-skip-tls-verify: false
  name: default
contexts:
- context:
    cluster: default
    user: default
  name: default
current-context: default
kind: Config
preferences: {}
users:
- name: default
  user:
    client-certificate-data: <BASE64_ENCODED_CLIENT_CERT>
    client-key-data: <BASE64_ENCODED_CLIENT_KEY>
