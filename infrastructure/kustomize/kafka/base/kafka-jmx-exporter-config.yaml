apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-jmx-exporter-config
data:
  jmx-exporter-config.yaml: |
    # JMX Exporter configuration for Kafka broker
    hostPort: 127.0.0.1:5555
    lowercaseOutputName: true
    lowercaseOutputLabelNames: true
    rules:
      # Broker metrics
      - pattern: kafka.server<type=(.+), name=(.+)><>([^:]+)
        name: kafka_server_$1_$3
        labels:
          name: $2
        type: GAUGE
      - pattern: kafka.controller<type=(.+), name=(.+)><>([^:]+)
        name: kafka_controller_$1_$3
        labels:
          name: $2
        type: GAUGE
      - pattern: kafka.network<type=(.+), name=(.+)><>([^:]+)
        name: kafka_network_$1_$3
        labels:
          name: $2
        type: GAUGE
      - pattern: kafka.log<type=(.+), name=(.+)><>([^:]+)
        name: kafka_log_$1_$3
        labels:
          name: $2
        type: GAUGE
      - pattern: java.lang<type=Memory><>([^:]+)
        name: java_lang_memory_$1
        type: GAUGE
      - pattern: java.lang<type=GarbageCollector, name=(.+)><>([^:]+)
        name: java_lang_gc_$2
        labels:
          name: $1
        type: GAUGE
