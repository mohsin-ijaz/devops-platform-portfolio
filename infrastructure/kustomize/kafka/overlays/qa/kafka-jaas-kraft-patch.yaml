apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-jaas
  namespace: kafka-qa
data:
  kafka_jaas.conf: |-
    KafkaServer {
      org.apache.kafka.common.security.plain.PlainLoginModule required
      user_kminion="kminion-exporter"
      user_schema-registry="schema-registry"
      user_eng-ancillary="<KAFKA_UI_PASSWORD>"
      user_eng-transactions="<KAFKA_UI_PASSWORD>"
      user_eng-inspection="<KAFKA_UI_PASSWORD>"
      user_leads-ms="<KAFKA_UI_PASSWORD>"
      user_nexus-vehicle="<KAFKA_UI_PASSWORD>"
      user_nexus-lead="<KAFKA_UI_PASSWORD>";
    };

