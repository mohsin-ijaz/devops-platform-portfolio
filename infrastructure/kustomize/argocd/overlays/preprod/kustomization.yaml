apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - path: argocd-server-deployment.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: argocd-server
  - path: argocd-server-service.yaml
    target:
      kind: Service
      name: argocd-server
  - path: node_selector.json
    target:
      group: apps
      version: v1
      kind: Deployment
  - path: node_selector.json
    target:
      group: apps
      version: v1
      kind: StatefulSet


commonLabels:
  env: preprod
