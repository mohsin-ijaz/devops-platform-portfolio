- op: add
  path: /spec/template/spec/nodeSelector
  value:
    cloud.google.com/gke-nodepool: np-cs-prod-enterprise-db-kafka-asse1-01
    workload: kafka
- op: add
  path: /spec/template/spec/tolerations
  value:
  - effect: NoSchedule
    key: dedicated
    operator: Equal
    value: kafka
- op: add
  path: /spec/template/spec/affinity
  value:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
          - key: app
            operator: In
            values:
            - kafka
        topologyKey: kubernetes.io/hostname
