apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-connect
  labels:
    app: kafka-connect
spec:
  replicas: 3
  selector:
    matchLabels:
      app: kafka-connect
  template:
    metadata:
      labels:
        app: kafka-connect
    spec:
      containers:
      - name: kafka-connect
        image: <GCP_REGION>-docker.pkg.dev/acme-preproduction/docker/kafka-connect:v7.7.1-mongodb1.13.0
        ports:
          - containerPort: 8083
        resources:
          requests:
            memory: 1Gi
            cpu: 500m
          limits:
            memory: 4Gi
            cpu: "2"
        volumeMounts:
          - name: credentials-volume
            mountPath: /opt
            readOnly: true
        env:
        - name: KAFKA_JMX_PORT
          value: "5555"
        - name: KAFKA_JMX_HOSTNAME
          value: "localhost"
        - name: CONNECT_BOOTSTRAP_SERVERS
          value: "kafka:9092"
        - name: CONNECT_REST_ADVERTISED_HOST_NAME
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: CONNECT_REST_PORT
          value: "8083"
        - name: CONNECT_GROUP_ID
          value: "kafka-connect"
        - name: CONNECT_CONFIG_STORAGE_TOPIC
          value: "kafka-connect-configs"
        - name: CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR
          value: "1"
        - name: CONNECT_OFFSET_FLUSH_INTERVAL_MS
          value: "10000"
        - name: CONNECT_OFFSET_STORAGE_TOPIC
          value: "kafka-connect-offsets"
        - name: CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR
          value: "1"
        - name: CONNECT_STATUS_STORAGE_TOPIC
          value: "kafka-connect-status"
        - name: CONNECT_STATUS_STORAGE_REPLICATION_FACTOR
          value: "1"
        - name: CONNECT_ZOOKEEPER_CONNECT
          value: "zookeeper:2181"
        - name: CONNECT_PLUGIN_PATH
          value: "/usr/share/java,/usr/share/confluent-hub-components"
        - name: CONNECT_CONNECTIONS_MAX_IDLE_MS
          value: "180000"
        - name: CONNECT_METADATA_MAX_AGE_MS
          value: "180000"
        - name: CONNECT_AUTO_CREATE_TOPICS_ENABLE
          value: "true"
        - name: CONNECT_KEY_CONVERTER
          value: "org.apache.kafka.connect.storage.StringConverter"
        - name: CONNECT_VALUE_CONVERTER
          value: "io.confluent.connect.avro.AvroConverter"
        - name: CONNECT_KEY_CONVERTER_SCHEMA_REGISTRY_URL
          value: http://schema-registry:8081
        - name: CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL
          value: http://schema-registry:8081
      - name: jmx-exporter
        image: bitnami/jmx-exporter:latest
        imagePullPolicy: IfNotPresent
        ports:
          - name: jmx-metrics
            containerPort: 9999
        env:
          - name: JAVA_OPTS
            value: "-Xmx128m"
          - name: JMX_EXPORTER_PORT
            value: "9999"
          - name: JMX_EXPORTER_CONFIG
            value: "/etc/jmx-exporter/jmx-exporter-config.yaml"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        volumeMounts:
          - name: jmx-exporter-config
            mountPath: /etc/jmx-exporter
      volumes:
        - name: credentials-volume
          secret:
            secretName: kafka-connect-databases-credentials
        - name: jmx-exporter-config
          configMap:
            name: kafka-connect-jmx-exporter-config
