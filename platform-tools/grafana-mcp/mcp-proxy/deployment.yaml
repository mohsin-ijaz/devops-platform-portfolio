---
# MCP Proxy - Bridges SSE-based Grafana MCP to HTTP/OpenAPI for Open WebUI
# This proxy converts the SSE transport used by grafana-mcp to OpenAPI endpoints
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-proxy
  namespace: lgtm-stack
  labels:
    app.kubernetes.io/name: mcp-proxy
    app.kubernetes.io/component: mcp-bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-proxy
    spec:
      containers:
        - name: mcp-proxy
          image: python:3.12-slim
          command:
            - /bin/bash
            - -c
            - |
              pip install --no-cache-dir httpx aiohttp fastapi uvicorn sseclient-py requests
              python /app/proxy.py
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: GRAFANA_MCP_URL
              value: "http://grafana-mcp:8000"
            - name: PROXY_PORT
              value: "8080"
            - name: MCP_PROXY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mcp-proxy-secret
                  key: api-key
          volumeMounts:
            - name: proxy-code
              mountPath: /app
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: proxy-code
          configMap:
            name: mcp-proxy-code
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-proxy
  namespace: lgtm-stack
  labels:
    app.kubernetes.io/name: mcp-proxy
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app.kubernetes.io/name: mcp-proxy
---
apiVersion: v1
kind: Secret
metadata:
  name: mcp-proxy-secret
  namespace: lgtm-stack
type: Opaque
stringData:
  # Change this to a secure random string
  api-key: "<MCP_PROXY_API_KEY>"
