apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: kafka
  name: gitlab-runner-kafka-role
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitlab-runner-kafka-binding
  namespace: kafka
subjects:
  - kind: ServiceAccount
    name: cs-gcp-prod-enterprise-apps-gke-standard-gitlab-runner
    namespace: gitlab-runner
roleRef:
  kind: Role
  name: gitlab-runner-kafka-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: kafka-prod
  name: gitlab-runner-kafka-role
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitlab-runner-kafka-binding
  namespace: kafka-prod
subjects:
  - kind: ServiceAccount
    name: cs-gcp-prod-enterprise-apps-gke-standard-gitlab-runner
    namespace: gitlab-runner
roleRef:
  kind: Role
  name: gitlab-runner-kafka-role
  apiGroup: rbac.authorization.k8s.io

