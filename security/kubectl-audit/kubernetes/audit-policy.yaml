# Kubernetes audit policy — three tiers based on risk.
# RequestResponse for the really sensitive stuff (exec, secrets, RBAC),
# Request for resource writes, Metadata for reads.
# Lots of noise exclusions at the bottom or you'll drown in kube-system churn.
#
# kube-apiserver flags needed:
#   --audit-policy-file=/etc/kubernetes/audit-policy.yaml
#   --audit-log-path=/var/log/kubernetes/audit/audit.log
#   --audit-log-maxage=365   # keep a year for compliance
#   --audit-log-maxbackup=10
#   --audit-log-maxsize=100
#   --audit-log-format=json

apiVersion: audit.k8s.io/v1
kind: Policy

# Omit the RequestReceived stage — log only when response is complete
# skip RequestReceived — only log once the response is ready
omitStages:
  - RequestReceived

rules:

  # Tier 1 — full request+response bodies. These are the things that actually hurt.

  # exec/attach — someone getting a shell inside a running container
  - level: RequestResponse
    verbs: ["create"]
    resources:
      - group: ""
        resources: ["pods/exec", "pods/attach"]
    annotations:
      audit.k8s.io/risk: "critical"

  # portforward — people use this to tunnel into databases, bypass firewalls etc
  - level: RequestResponse
    verbs: ["create"]
    resources:
      - group: ""
        resources: ["pods/portforward"]
    annotations:
      audit.k8s.io/iso-control: "A.12.4.3"
      audit.k8s.io/risk: "high"

  # secret reads/writes — track every human touching credentials
  - level: RequestResponse
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    resources:
      - group: ""
        resources: ["secrets"]
    annotations:
      audit.k8s.io/iso-control: "A.12.4.1,A.9.4.2"
      audit.k8s.io/risk: "critical"

  # RBAC changes — classic privilege escalation path
  - level: RequestResponse
    verbs: ["create", "update", "patch", "delete", "bind", "escalate"]
    resources:
      - group: "rbac.authorization.k8s.io"
        resources:
          - "clusterroles"
          - "clusterrolebindings"
          - "roles"
          - "rolebindings"
    annotations:
      audit.k8s.io/iso-control: "A.9.2.3,A.12.4.3"
      audit.k8s.io/risk: "critical"

  # manual token creation — bypasses token expiry, red flag if a human does this
  - level: RequestResponse
    verbs: ["create"]
    resources:
      - group: ""
        resources: ["serviceaccounts/token"]
      - group: "authentication.k8s.io"
        resources: ["tokenreviews"]
    annotations:
      audit.k8s.io/iso-control: "A.9.2.3"
      audit.k8s.io/risk: "high"

  # webhook config changes affect everything created in the cluster
  - level: RequestResponse
    verbs: ["create", "update", "patch", "delete"]
    resources:
      - group: "admissionregistration.k8s.io"
        resources:
          - "mutatingwebhookconfigurations"
          - "validatingwebhookconfigurations"
    annotations:
      audit.k8s.io/iso-control: "A.12.4.3"
      audit.k8s.io/risk: "high"

  # network policy changes — affects what can talk to what
  - level: RequestResponse
    verbs: ["create", "update", "patch", "delete"]
    resources:
      - group: "networking.k8s.io"
        resources: ["networkpolicies"]
    annotations:
      audit.k8s.io/iso-control: "A.13.1.3"
      audit.k8s.io/risk: "high"

  # pod security policy / istio policy changes
  - level: RequestResponse
    verbs: ["create", "update", "patch", "delete"]
    resources:
      - group: "policy"
        resources: ["podsecuritypolicies"]
      - group: "security.istio.io"
        resources: ["authorizationpolicies", "peerauthentications"]

  # CSR approvals — track cert issuance
  - level: RequestResponse
    verbs: ["create", "update", "patch", "delete", "approve"]
    resources:
      - group: "certificates.k8s.io"
        resources: ["certificatesigningrequests"]

  # Tier 2 — log the request body but not the response (saves space)

  # pod and workload changes — what got deployed and by whom
  - level: Request
    verbs: ["create", "update", "patch", "delete"]
    resources:
      - group: ""
        resources: ["pods", "pods/log"]
      - group: "apps"
        resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    annotations:
      audit.k8s.io/iso-control: "A.12.4.1"

  # configmap writes in system namespaces — can affect cluster behaviour
  - level: Request
    verbs: ["create", "update", "patch", "delete"]
    resources:
      - group: ""
        resources: ["configmaps"]
    namespaces:
      - "kube-system"
      - "istio-system"
      - "cert-manager"
      - "monitoring"
    annotations:
      audit.k8s.io/iso-control: "A.12.4.1"

  # node operations
  - level: Request
    verbs: ["create", "update", "patch", "delete", "drain", "taint"]
    resources:
      - group: ""
        resources: ["nodes"]
    annotations:
      audit.k8s.io/iso-control: "A.12.4.3"

  # PV/PVC changes
  - level: Request
    verbs: ["create", "update", "patch", "delete"]
    resources:
      - group: ""
        resources: ["persistentvolumes", "persistentvolumeclaims"]

  # namespace create/delete — significant scope changes
  - level: Request
    verbs: ["create", "delete"]
    resources:
      - group: ""
        resources: ["namespaces"]

  # CRDs we care about — ArgoCD apps, external secrets, certs
  - level: Request
    verbs: ["create", "update", "patch", "delete"]
    resources:
      - group: "argoproj.io"
        resources: ["applications", "appprojects"]
      - group: "external-secrets.io"
        resources: ["externalsecrets", "clustersecretstores"]
      - group: "cert-manager.io"
        resources: ["certificates", "issuers", "clusterissuers"]

  # Tier 3 — metadata only (user, verb, resource). Enough for access audits.

  # catch all reads
  - level: Metadata
    verbs: ["get", "list", "watch"]
    resources:
      - group: ""
        resources: ["*"]
      - group: "apps"
        resources: ["*"]
      - group: "batch"
        resources: ["*"]
    annotations:
      audit.k8s.io/iso-control: "A.12.4.1"

  # impersonation
  - level: Metadata
    verbs: ["impersonate"]

  # Noise exclusions — without these the log is 90% kube-system garbage

  # leader election churn from controllers
  - level: None
    users:
      - "system:kube-controller-manager"
      - "system:kube-scheduler"
    verbs: ["get", "update", "patch"]
    resources:
      - group: ""
        resources: ["configmaps", "endpoints", "leases"]
    namespaces:
      - "kube-system"

  # health endpoints
  - level: None
    nonResourceURLs:
      - "/healthz*"
      - "/readyz*"
      - "/livez*"
      - "/metrics"
      - "/version"
      - "/apis"
      - "/api"

  # Skip kube-proxy and CNI noise
  - level: None
    users:
      - "system:kube-proxy"
    verbs: ["watch"]
    resources:
      - group: ""
        resources: ["endpoints", "services", "endpointslices"]

  # node/pod status updates — extremely high volume, not useful
  - level: None
    userGroups:
      - "system:nodes"
    verbs: ["update", "patch"]
    resources:
      - group: ""
        resources: ["nodes/status", "pods/status"]

  # garbage collection and namespace controller noise
  - level: None
    users:
      - "system:serviceaccount:kube-system:generic-garbage-collector"
      - "system:serviceaccount:kube-system:namespace-controller"

  # catch-all
  - level: Metadata
