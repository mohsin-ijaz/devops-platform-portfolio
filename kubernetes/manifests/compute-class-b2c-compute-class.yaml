---
apiVersion: cloud.google.com/v1
kind: ComputeClass
metadata:
  name: prod-consumer-standard
spec:
  priorities:
    - machineType: n2-standard-4
      spot: true
      storage:
        bootDiskType: pd-standard
        bootDiskSize: 100
    
    - machineType: e2-standard-4
      spot: true
      storage:
        bootDiskType: pd-standard
        bootDiskSize: 100
    
    - machineType: n2d-standard-4
      spot: true
      storage:
        bootDiskType: pd-standard
        bootDiskSize: 100
    
    - machineType: c3-standard-4
      spot: true
      storage:
        bootDiskType: pd-standard
        bootDiskSize: 100
    
    - machineType: n2-standard-4
      spot: false
      storage:
        bootDiskType: pd-standard
        bootDiskSize: 100

  nodePoolConfig:
    imageType: cos_containerd
    serviceAccount: <GCP_NODE_SERVICE_ACCOUNT>

  nodePoolAutoCreation:
    enabled: true

  whenUnsatisfiable: DoNotScaleUp

  autoscalingPolicy:
    consolidationDelayMinutes: 10
    consolidationThreshold: 70

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gke-compute-class-config
  namespace: kube-system
  labels:
    gke.io/compute-class-config: "true"
data:
  default: prod-consumer-standard
