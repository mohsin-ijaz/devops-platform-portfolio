---
apiVersion: cloud.google.com/v1
kind: ComputeClass
metadata:
  name: prod-enterprise-standard-8
spec:
  priorities:
    - machineType: n2-standard-8
      spot: true
      storage:
        bootDiskType: pd-standard
        bootDiskSize: 200
    
    - machineType: n2d-standard-8
      spot: true
      storage:
        bootDiskType: pd-standard
        bootDiskSize: 200
    
    - machineType: c3-standard-8
      spot: true
      storage:
        bootDiskType: pd-standard
        bootDiskSize: 200
    
    - machineType: n2-standard-8
      spot: false
      storage:
        bootDiskType: pd-standard
        bootDiskSize: 200

  nodePoolConfig:
    imageType: cos_containerd
    serviceAccount: <GCP_NODE_SERVICE_ACCOUNT>

  nodePoolAutoCreation:
    enabled: true

  whenUnsatisfiable: DoNotScaleUp

  autoscalingPolicy:
    consolidationDelayMinutes: 10
    consolidationThreshold: 70

---
apiVersion: cloud.google.com/v1
kind: ComputeClass
metadata:
  name: prod-enterprise-standard-4
spec:
  priorities:
    - machineType: n2-standard-4
      spot: true
      storage:
        bootDiskType: pd-standard
        bootDiskSize: 100

    - machineType: e2-standard-4
      spot: true
      storage:
        bootDiskType: pd-standard
        bootDiskSize: 100
    
    - machineType: n2d-standard-4
      spot: true
      storage:
        bootDiskType: pd-standard
        bootDiskSize: 100
    
    - machineType: n2-standard-4
      spot: false
      storage:
        bootDiskType: pd-standard
        bootDiskSize: 100

  nodePoolConfig:
    imageType: cos_containerd
    serviceAccount: <GCP_NODE_SERVICE_ACCOUNT>

  nodePoolAutoCreation:
    enabled: true

  whenUnsatisfiable: DoNotScaleUp

  autoscalingPolicy:
    consolidationDelayMinutes: 10
    consolidationThreshold: 70

---
apiVersion: cloud.google.com/v1
kind: ComputeClass
metadata:
  name: prod-enterprise-highmem-8
spec:
  priorities:
    - machineType: n2-highmem-8
      spot: false
      storage:
        bootDiskType: pd-standard
        bootDiskSize: 500
    
    - machineType: n2d-highmem-8
      spot: false
      storage:
        bootDiskType: pd-standard
        bootDiskSize: 500
    
    - machineType: c3-highmem-8
      spot: false
      storage:
        bootDiskType: pd-standard
        bootDiskSize: 500

  nodePoolConfig:
    imageType: cos_containerd
    serviceAccount: <GCP_NODE_SERVICE_ACCOUNT>

  nodePoolAutoCreation:
    enabled: true

  whenUnsatisfiable: DoNotScaleUp

  autoscalingPolicy:
    consolidationDelayMinutes: 15
    consolidationThreshold: 75

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gke-compute-class-config
  namespace: kube-system
  labels:
    gke.io/compute-class-config: "true"
data:
  default: prod-enterprise-standard-8
