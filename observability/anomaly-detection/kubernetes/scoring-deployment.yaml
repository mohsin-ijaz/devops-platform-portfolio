# FastAPI scoring service — keeps running so Grafana/Alertmanager can call it anytime.

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anomaly-scorer
  namespace: monitoring
  labels:
    app: anomaly-detection
    component: scorer
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: anomaly-detection
      component: scorer
  template:
    metadata:
      labels:
        app: anomaly-detection
        component: scorer
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        workload: general

      containers:
        - name: scorer
          image: <YOUR_REGISTRY>/anomaly-detection-scorer:<IMAGE_TAG>
          imagePullPolicy: Always
          command: ["python", "serving/scorer.py"]
          ports:
            - containerPort: 8080
              name: http

          env:
            - name: MODEL_DIR
              value: /models/latest
            - name: CONFIG_PATH
              value: /app/config/features.yaml
            - name: WORKERS
              value: "2"
            - name: PORT
              value: "8080"

          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: 2000m
              memory: 4Gi

          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 10
            # Model loading can take 60s (LSTM is large)

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3

          volumeMounts:
            - name: model-output
              mountPath: /models
              readOnly: true
            - name: config
              mountPath: /app/config
              readOnly: true

      volumes:
        - name: model-output
          persistentVolumeClaim:
            claimName: anomaly-model-output
            readOnly: true
        - name: config
          configMap:
            name: anomaly-detection-config

---
apiVersion: v1
kind: Service
metadata:
  name: anomaly-scorer
  namespace: monitoring
  labels:
    app: anomaly-detection
    component: scorer
spec:
  selector:
    app: anomaly-detection
    component: scorer
  ports:
    - port: 80
      targetPort: 8080
      name: http

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: anomaly-scorer
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: anomaly-detection
      component: scorer
  endpoints:
    - port: http
      path: /metrics
      interval: 30s

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: anomaly-scorer
  namespace: monitoring
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: anomaly-scorer
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
