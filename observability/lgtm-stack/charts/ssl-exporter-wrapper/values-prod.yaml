# Production environment values for ssl-exporter-wrapper
# SSL Certificate expiry monitoring using ribbybibby/ssl_exporter

# Part-of label for ServiceMonitor discovery
partOf: lgtm-stack

# Docker image configuration
image:
  repository: ribbybibby/ssl-exporter
  tag: "2.4.3"
  pullPolicy: IfNotPresent

# Node selector - use system pool
nodeSelector:
  workload: system

# Tolerations for system pool
tolerations:
  - key: workload
    operator: Equal
    value: system
    effect: NoSchedule

# Resource configuration for prod
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

# ServiceMonitor/Probe for Prometheus discovery
serviceMonitor:
  enabled: true
  interval: "1h"  # Check SSL certs every hour
  scrapeTimeout: "30s"
  labels:
    app.kubernetes.io/name: ssl-exporter
    monitoring.grafana.com/scrape: "true"
    release: prometheus-prod

# Pod annotations
podAnnotations:
  cluster-autoscaler.kubernetes.io/safe-to-evict: "true"

# Pod labels
podLabels:
  app.kubernetes.io/part-of: lgtm-stack
  sre.io/service: ssl-exporter
  sre.io/tier: monitoring

# SSL targets to monitor for certificate expiry
# All domains including those not supported by domain-exporter whois
