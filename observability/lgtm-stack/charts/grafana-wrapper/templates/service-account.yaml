{{- if .Values.workloadIdentity.enabled }}
# ServiceAccount with Workload Identity for Grafana
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-sa
  namespace: {{ .Release.Namespace }}
  annotations:
    # Workload Identity binding
    iam.gke.io/gcp-service-account: {{ .Values.workloadIdentity.gcp_service_account }}
    
    # ArgoCD sync wave - deploy before Grafana pod
    argocd.argoproj.io/sync-wave: "-1"
    
    # SRE metadata
    sre.io/service: "grafana"
    sre.io/component: "authentication"
    
  labels:
    {{- include "grafana-wrapper.labels" . | nindent 4 }}
    app.kubernetes.io/component: service-account
{{- end }}
