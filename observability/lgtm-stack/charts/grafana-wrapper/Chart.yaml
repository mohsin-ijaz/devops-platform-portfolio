apiVersion: v2
name: grafana-wrapper
description: Wrapper chart for Grafana with preconfigured LGTM datasources
type: application
version: 1.0.0
appVersion: "12.1.1"

# Metadata
keywords:
  - grafana
  - visualization
  - dashboards
  - observability
  - lgtm-stack
home: https://grafana.com/
sources:
  - https://github.com/grafana/grafana

maintainers:
  - name: Platform Team
    email: platform@example.com

# Dependencies - Official Grafana Helm chart
dependencies:
  - name: grafana
    version: 10.0.0
    repository: https://grafana.github.io/helm-charts
    alias: grafana
