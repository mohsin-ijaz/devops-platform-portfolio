
partOf: lgtm-stack

# Docker image configuration
image:
  tag: "v1.24.1"
  pullPolicy: IfNotPresent

# Node selector - use system pool
nodeSelector:
  workload: system

# Tolerations for system pool
tolerations:
  - key: workload
    operator: Equal
    value: system
    effect: NoSchedule

# Resource configuration for prod
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

# ServiceMonitor for Prometheus discovery
serviceMonitor:
  enabled: true
  interval: "5m"  # Check domains every 5 minutes
  scrapeTimeout: "30s"
  labels:
    app.kubernetes.io/name: domain-exporter
    monitoring.grafana.com/scrape: "true"

# Pod annotations
podAnnotations:
  cluster-autoscaler.kubernetes.io/safe-to-evict: "true"

# Pod labels
podLabels:
  app.kubernetes.io/part-of: lgtm-stack
  sre.io/service: domain-exporter
  sre.io/tier: monitoring

# Acme domains to monitor for expiry
# Removed 18 domains that were causing restart loop:
#   .ph/.vn TLDs: WHOIS unsupported ("URL not supported")
#   .me/.asia TLDs: WHOIS server timeouts
#   acme.ae: IP blacklisted by WHOIS provider
#   one2carbid.com/mobil123bid.com: WHOIS date parsing failures
