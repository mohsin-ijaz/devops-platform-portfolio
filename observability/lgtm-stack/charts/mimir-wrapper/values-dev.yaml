# Mimir Wrapper Chart - Development Values
# This passes values to the official mimir-distributed chart

# Enable the official Mimir chart
mimir:
  enabled: true
  
  # All official chart values go under 'mimir:'
  
  # Global service account configuration
  # This ensures all Mimir components use our custom mimir-sa
  serviceAccount:
    create: false
    name: mimir-sa

  # Ingester - CRITICAL (On-Demand nodes)
  ingester:
    zoneAwareReplication:
      enabled: false
    replicas: 3
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 8Gi
    nodeSelector:
      workload: ingester
    tolerations:
      - key: workload
        operator: Equal
        value: ingester
        effect: NoSchedule
    persistentVolume:
      enabled: true
      size: 100Gi
      storageClass: premium-rwo
    podAnnotations:
      cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    
    # Use our custom ServiceAccount
    serviceAccount:
      create: false
      name: mimir-sa

  # Distributor - SPOT-FRIENDLY
  distributor:
    replicas: 2
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi
    nodeSelector:
      workload: general
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    serviceAccount:
      create: false
      name: mimir-sa

  # Querier - SPOT-FRIENDLY  
  querier:
    replicas: 2
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 4Gi
    nodeSelector:
      workload: query
    tolerations:
      - key: workload
        operator: Equal
        value: query
        effect: NoSchedule
    serviceAccount:
      create: false
      name: mimir-sa

  # Query Frontend - SPOT-FRIENDLY
  query_frontend:
    replicas: 2
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    nodeSelector:
      workload: query
    tolerations:
      - key: workload
        operator: Equal
        value: query  
        effect: NoSchedule
    serviceAccount:
      create: false
      name: mimir-sa

  # Query Scheduler - SPOT-FRIENDLY
  query_scheduler:
    enabled: true
    replicas: 2
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    nodeSelector:
      workload: query
    tolerations:
      - key: workload
        operator: Equal
        value: query
        effect: NoSchedule

  # Store Gateway - SPOT-FRIENDLY
  store_gateway:
    zoneAwareReplication:
      enabled: false
    replicas: 2
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        cpu: 1000m
        memory: 2Gi
    nodeSelector:
      workload: general
    persistentVolume:
      enabled: true
      size: 50Gi
      storageClass: premium-rwo
    serviceAccount:
      create: false
      name: mimir-sa

  # Compactor - SPOT-FRIENDLY
  compactor:
    replicas: 1
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        cpu: 1000m
        memory: 2Gi
    nodeSelector:
      workload: general
    persistentVolume:
      enabled: true
      size: 50Gi
      storageClass: premium-rwo
    serviceAccount:
      create: false
      name: mimir-sa

  # Ruler - SPOT-FRIENDLY
  ruler:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    nodeSelector:
      workload: general
    serviceAccount:
      create: false
      name: mimir-sa

  # Alertmanager - CRITICAL
  alertmanager:
    enabled: true
    replicas: 2
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    nodeSelector:
      workload: ingester
    tolerations:
      - key: workload
        operator: Equal
        value: ingester
        effect: NoSchedule
    persistentVolume:
      enabled: true
      size: 10Gi
      storageClass: premium-rwo
    podAnnotations:
      cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    serviceAccount:
      create: false
      name: mimir-sa

  # External Memcached (deployed separately)
  memcached:
    enabled: false

  # Disable MinIO (using GCS instead)
  minio:
    enabled: false
  
  # Disable Kafka (not using ingest path - direct ingester write is sufficient)
  kafka:
    enabled: false
  
  # Disable rollout operator (CRDs not available)
  rollout_operator:
    enabled: false

  externalMemcached:
    chunks:
      addresses: "memcached.lgtm-stack.svc.cluster.local:11211"
    frontend:
      addresses: "memcached.lgtm-stack.svc.cluster.local:11211"
    metadata:
      addresses: "memcached.lgtm-stack.svc.cluster.local:11211"
    index_queries:
      addresses: "memcached.lgtm-stack.svc.cluster.local:11211"

  # Meta Monitoring - ServiceMonitors for Prometheus scraping
  metaMonitoring:
    serviceMonitor:
      enabled: true
      clusterLabel: ""
      interval: 30s
      labels:
        app.kubernetes.io/part-of: lgtm-stack
      # Override job labels to use mimir-{component} format like Loki
      # This makes dashboard queries consistent across Mimir, Loki, Tempo
      relabelings:
        - sourceLabels: [__address__]
          targetLabel: job
          regex: "mimir-(.*):.*"
          replacement: "mimir-$1"
    
    # Enable recording rules for Mimir dashboards
    prometheusRule:
      enabled: true
      mimirAlerts: true
      mimirRules: true
      labels:
        app.kubernetes.io/part-of: lgtm-stack

  # Mimir-specific configuration (nested under mimir. for the subchart)
  # Reference: https://grafana.com/docs/mimir/latest/configure/configure-object-storage-backend/
  mimir:
    # Use structuredConfig to override storage backend from S3 to GCS
    structuredConfig:
      # Disable ingest storage (we use direct push to ingesters)
      ingest_storage:
        enabled: false
      
      # Server configuration
      server:
        grpc_server_max_recv_msg_size: 104857600  # 100MB
        grpc_server_max_send_msg_size: 104857600  # 100MB
      
      # Replication - reduced to 1 for performance (no HA)
      ingester:
        push_grpc_method_enabled: true
        ring:
          replication_factor: 1
          zone_awareness_enabled: false
      
      # Common storage configuration for GCS (using Workload Identity, no service_account needed)
      common:
        storage:
          backend: gcs
          gcs:
            bucket_name: "<GCS_BUCKET_NAME>"
      
      # Blocks storage - override to use GCS
      blocks_storage:
        backend: gcs
        storage_prefix: "blocks"
        gcs:
          bucket_name: "<GCS_BUCKET_NAME>"
      
      # Alertmanager storage - override to use GCS
      alertmanager_storage:
        backend: gcs
        storage_prefix: "alertmanager"
        gcs:
          bucket_name: "<GCS_BUCKET_NAME>"
      
      # Ruler storage - override to use GCS  
      ruler_storage:
        backend: gcs
        storage_prefix: "ruler"
        gcs:
          bucket_name: "<GCS_BUCKET_NAME>"
      
      # Store-gateway ring config
      store_gateway:
        sharding_ring:
          zone_awareness_enabled: false

      # Tenant limits - Production scale for 4 clusters (1 current + 3 more including heavy production)
      limits:
        # Maximum active series per tenant (default: 150000)
        # Planning: Current cluster = 40% load, need 3x more clusters + 1 heavy production
        # Assuming production cluster = 5x current load, total = 1 + 1 + 1 + 5 = 8x capacity needed
        max_global_series_per_user: 50000000  # 50 million series (5x increase for safety)
        
        # Ingestion rate limits per tenant
        ingestion_rate: 1000000  # 1M samples/sec (5x increase for production burst)
        ingestion_burst_size: 10000000  # 10M burst capacity
        
        # Query limits (increased for production dashboards)
        max_fetched_series_per_query: 500000  # 5x increase
        max_fetched_chunks_per_query: 10000000  # 5x increase
        
        # Label limits (fix current rejection issue)
        max_label_names_per_series: 60  # Increased from default 30 to support Alloy's enriched labels
        max_label_name_length: 1024  # Increase label name length
        max_label_value_length: 2048  # Increase label value length
        
        # Out-of-order samples (fix current rejection issue)
        out_of_order_time_window: 30m  # Allow samples up to 30 minutes in the past for clock skew across clusters

# Configuration for additional resources (our custom templates)
workloadIdentity:
  enabled: true
  gcp_service_account: <GCP_SERVICE_ACCOUNT>

networkPolicy:
  enabled: true

podDisruptionBudget:
  enabled: true
