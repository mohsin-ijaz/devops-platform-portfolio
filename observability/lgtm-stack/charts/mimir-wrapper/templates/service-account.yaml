{{- if .Values.workloadIdentity.enabled }}
# ServiceAccount with Workload Identity for Mimir
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mimir-sa
  namespace: {{ .Release.Namespace }}
  annotations:
    # Workload Identity binding
    iam.gke.io/gcp-service-account: {{ .Values.workloadIdentity.gcp_service_account }}
    
    # ArgoCD sync wave - deploy before Mimir pods
    argocd.argoproj.io/sync-wave: "-1"
    
    # SRE metadata
    sre.io/service: "mimir"
    sre.io/component: "authentication"
    
  labels:
    {{- include "mimir-wrapper.labels" . | nindent 4 }}
    app.kubernetes.io/component: service-account

---
# ClusterRole for Mimir operations
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-mimir-role
  labels:
    {{- include "mimir-wrapper.labels" . | nindent 4 }}
rules:
  # Required for memberlist service discovery
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["get", "list", "watch"]
  # Required for querying
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list"]

---
# ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-mimir-binding
  labels:
    {{- include "mimir-wrapper.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-mimir-role
subjects:
  - kind: ServiceAccount
    name: mimir-sa
    namespace: {{ .Release.Namespace }}
{{- end }}