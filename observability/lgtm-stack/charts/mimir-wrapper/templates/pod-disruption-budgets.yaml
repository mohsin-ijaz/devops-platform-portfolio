{{- if .Values.podDisruptionBudget.enabled }}
# Pod Disruption Budget for Mimir Ingester - CRITICAL component
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-mimir-ingester-pdb
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mimir-wrapper.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingester
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    sre.io/criticality: "high"
spec:
  minAvailable: 2  # Always keep at least 2 ingesters running
  selector:
    matchLabels:
      app.kubernetes.io/name: mimir
      app.kubernetes.io/component: ingester
      app.kubernetes.io/instance: {{ .Release.Name }}

