{{- if .Values.rulesSync.enabled }}
{{- $files := .Files }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mimir-wrapper.fullname" . }}-rules
  labels:
    {{- include "mimir-wrapper.labels" . | nindent 4 }}
data:
  {{- range $path, $_ := .Files.Glob "rules/prometheus/*.yaml" }}
  {{ base $path }}: |
    {{- $files.Get $path | nindent 4 }}
  {{- end }}
  {{- if .Values.rulesSync.rules }}
  {{- range $name, $content := .Values.rulesSync.rules }}
  {{ $name }}.yaml: |
    {{- $content | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end }}
