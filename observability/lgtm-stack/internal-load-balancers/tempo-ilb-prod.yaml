apiVersion: v1
kind: Service
metadata:
  name: tempo-ilb-prod
  namespace: lgtm-stack
  annotations:
    # Internal Load Balancer (private, not internet-facing)
    networking.gke.io/load-balancer-type: "Internal"
    # Allow cross-project access (for other clusters to reach <GCP_MGMT_PROJECT>)
    networking.gke.io/internal-load-balancer-allow-global-access: "true"
  labels:
    app: tempo
    component: ilb
    service: tempo-ingestion
    environment: production
spec:
  type: LoadBalancer
  
  # Static IP - Reserved for Production
  loadBalancerIP: <TEMPO_ILB_IP>
  
  # Security: Allow only GCP internal networks
  loadBalancerSourceRanges:
    - 10.0.0.0/8  # All GCP internal networks
  
  ports:
    - name: http-traces
      port: 3200
      targetPort: 3200
      protocol: TCP
    - name: grpc-otlp
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: http-otlp
      port: 4318
      targetPort: 4318
      protocol: TCP
    - name: jaeger-grpc
      port: 14250
      targetPort: 14250
      protocol: TCP
  
  # Target the tempo-prod-distributor service
  selector:
    app.kubernetes.io/name: tempo
    app.kubernetes.io/component: distributor
  
  # Session affinity for consistent routing
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800  # 3 hours
  
  externalTrafficPolicy: Cluster
