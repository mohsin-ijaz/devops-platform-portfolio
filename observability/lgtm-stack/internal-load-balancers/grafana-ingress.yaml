apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-ingress
  namespace: lgtm-stack
  annotations:
    # GCE ingress for external HTTPS load balancer
    kubernetes.io/ingress.class: "gce"
    # Use the pre-created static IP
    kubernetes.io/ingress.global-static-ip-name: "monitoring-acme-ip"
    # Managed certificate for monitoring.acme.com
    networking.gke.io/managed-certificates: "grafana-monitoring-cert"
    # BackendConfig for health check customization
    cloud.google.com/backend-config: '{"default": "grafana-backend-config"}'
  labels:
    app: grafana
    component: ingress
    service: grafana-external-access
spec:
  rules:
    - host: monitoring.acme.com
      http:
        paths:
          - path: /*
            pathType: ImplementationSpecific
            backend:
              service:
                name: prometheus-grafana
                port:
                  number: 80
---
# Service patch for BackendConfig annotation
# This patches the Helm-managed Grafana service to add the BackendConfig annotation
# Required for GKE NEG-based ingress to respect the timeout settings
apiVersion: v1
kind: Service
metadata:
  name: prometheus-grafana
  namespace: lgtm-stack
  annotations:
    cloud.google.com/backend-config: '{"default": "grafana-backend-config"}'
spec:
  type: ClusterIP
  ports:
    - name: http-web
      port: 80
      targetPort: 3000
      protocol: TCP
  selector:
    app.kubernetes.io/instance: prometheus
    app.kubernetes.io/name: grafana
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: grafana-monitoring-cert
  namespace: lgtm-stack
spec:
  domains:
    - monitoring.acme.com
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: grafana-backend-config
  namespace: lgtm-stack
spec:
  healthCheck:
    checkIntervalSec: 10
    timeoutSec: 5
    healthyThreshold: 2
    unhealthyThreshold: 3
    type: HTTP
    requestPath: /api/health
    port: 3000
  # Increased from 30s to 1200s (20 min) to support 30-day Loki queries
  # Must match Loki gateway nginx proxy_read_timeout and query_timeout
  timeoutSec: 1200
  connectionDraining:
    drainingTimeoutSec: 60
